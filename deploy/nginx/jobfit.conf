# 复制到宿主机 /etc/nginx/sites-available/jobfit.conf
# 再执行：sudo ln -s /etc/nginx/sites-available/jobfit.conf /etc/nginx/sites-enabled/
#         sudo certbot --nginx -d jobfit.example.com
#         sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name jobfit.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name jobfit.example.com;

    ssl_certificate     /etc/letsencrypt/live/jobfit.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jobfit.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 20m;

    root  /opt/jobfit/web;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass         http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 插件安装包与更新描述
    location /extension/ {
        alias /opt/jobfit/extension/;
        add_header Cache-Control "no-cache";
    }
}
