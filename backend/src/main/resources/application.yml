server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: jobfit
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  jackson:
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: false

app:
  algo:
    base-url: ${ALGO_BASE_URL:http://localhost:8000}
    connect-timeout-ms: ${ALGO_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${ALGO_READ_TIMEOUT_MS:15000}
  minio:
    endpoint: ${MINIO_ENDPOINT:}
    access-key: ${MINIO_ACCESS_KEY:}
    secret-key: ${MINIO_SECRET_KEY:}
    bucket-resume: ${MINIO_BUCKET_RESUME:resume}
    bucket-export: ${MINIO_BUCKET_EXPORT:export}
  match:
    weights:
      skill: 0.40
      sem: 0.25
      exp: 0.20
      edu: 0.15
  apply:
    daily-limit-default: ${APPLY_DAILY_LIMIT_DEFAULT:30}
